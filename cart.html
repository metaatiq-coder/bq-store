<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - Atiq Super Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="src/css/style.css">
</head>
<body class="bg-white text-gray-900">
    <!-- Navigation -->
    <nav class="fixed w-full top-0 z-50 bg-white border-b border-gray-200 shadow">
        <div class="max-w-6xl mx-auto px-4">
            <div class="flex justify-between items-center h-16">
                <a href="index.html" class="text-xl font-bold text-gold">🏪 Atiq Super Store</a>
                <div class="hidden md:flex gap-6">
                    <a href="products.html" class="text-gold font-bold">Products</a>
                </div>
                <div class="flex items-center gap-4">
                    <a href="cart.html" class="text-2xl hover:opacity-70">🛒</a>
                    <a href="admin.html" id="adminBtn" class="hidden px-3 py-1 bg-gold text-black text-sm font-bold rounded hover:bg-yellow-400">Admin</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="pt-20 pb-12 max-w-6xl mx-auto px-4">
        <h1 class="text-4xl font-bold mb-8 text-gold">Shopping Cart</h1>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Cart Items -->
            <div class="lg:col-span-2">
                <div id="cartItems" class="space-y-4"></div>
                <div id="emptyCart" class="text-center py-16">
                    <p class="text-xl text-gray-400 mb-4">Cart is empty</p>
                    <a href="products.html" class="px-6 py-2 bg-gold text-black font-bold rounded hover:bg-yellow-400">Continue Shopping</a>
                </div>
            </div>

            <!-- Cart Summary -->
            <div class="lg:col-span-1">
                <div id="cartSummary" class="hidden bg-gray-50 rounded border border-gray-200 p-6 sticky top-20">
                    <h2 class="text-2xl font-bold text-gold mb-6">Order Summary</h2>
                    
                    <div class="space-y-3 mb-6 pb-6 border-b border-gray-300">
                        <div class="flex justify-between text-gray-700">
                            <span>Subtotal</span>
                            <span id="subtotal" class="font-bold">$0.00</span>
                        </div>
                        <div class="flex justify-between text-gray-700">
                            <span>Shipping</span>
                            <span class="font-bold">Free</span>
                        </div>
                        <div class="flex justify-between text-gray-700">
                            <span>Tax (5%)</span>
                            <span id="tax" class="font-bold">$0.00</span>
                        </div>
                    </div>

                    <div class="flex justify-between mb-6">
                        <span class="text-lg font-bold">Total</span>
                        <span id="total" class="text-2xl font-bold text-gold">$0.00</span>
                    </div>

                    <button id="checkoutBtn" class="w-full px-6 py-2 bg-gold text-black font-bold rounded hover:bg-yellow-400 mb-3">
                        Checkout
                    </button>
                    <a href="products.html" class="block text-center px-6 py-2 border border-gray-300 rounded hover:bg-gray-100">
                        Continue Shopping
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js"></script>

    <script src="src/js/config.js"></script>
    <script src="src/js/utils.js"></script>
    <script src="src/js/cart.js"></script>
</body>
</html>
