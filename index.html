<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Atiq Super Store - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="src/css/style.css">
</head>

<body class="flex items-center justify-center min-h-screen bg-gradient-to-br from-black via-slate-900 to-black">

  <div class="w-96 p-8 bg-slate-900 border border-gold/30 rounded-2xl shadow-2xl">

    <h1 class="text-3xl font-bold mb-2 text-gold text-center">Atiq Super Store</h1>
    <p class="text-center text-gray-400 mb-8">Customer Login</p>

    <!-- LOGIN FORM -->
    <form id="loginForm" class="space-y-4">

      <div>
        <label class="block text-gold font-bold mb-2">Email</label>
        <input
          id="email"
          type="email"
          placeholder="your@email.com"
          class="w-full p-3 bg-slate-800 border border-gold/30 rounded-lg text-white focus:outline-none focus:border-gold"
          required
        >
      </div>

      <div>
        <label class="block text-gold font-bold mb-2">Password</label>
        <input
          id="password"
          type="password"
          placeholder="••••••••"
          class="w-full p-3 bg-slate-800 border border-gold/30 rounded-lg text-white focus:outline-none focus:border-gold"
          required
        >
      </div>

      <button
        type="submit"
        class="w-full bg-gradient-to-r from-gold to-yellow-300 text-black p-3 rounded-lg font-bold hover:shadow-2xl hover:shadow-gold/50 transition disabled:opacity-50 disabled:cursor-not-allowed"
      >
        Login
      </button>

      <button
        type="button"
        onclick="window.location.href='products.html'"
        class="w-full bg-slate-700 hover:bg-slate-600 text-white p-3 rounded-lg font-bold transition"
      >
        Continue as Guest
      </button>

      <p id="error" class="text-red-400 text-sm mt-2 hidden p-3 bg-red-900/20 rounded"></p>
      <p id="success" class="text-green-400 text-sm mt-2 hidden p-3 bg-green-900/20 rounded"></p>

    </form>

    <!-- Demo Users -->
    <div class="mt-6 pt-6 border-t border-gold/20">
      <p class="text-gray-400 text-xs mb-3 text-center">Test Accounts:</p>
      
      <div class="space-y-2">
        <button onclick="fillDemo('customer@atiq.com', 'Customer123!')" class="w-full text-left p-2 text-xs bg-blue-900/30 hover:bg-blue-900/50 text-blue-300 rounded transition border border-blue-700/30">
          👤 Customer: customer@atiq.com / Customer123!
        </button>
        <button onclick="fillDemo('admin@atiq.com', 'Admin123!')" class="w-full text-left p-2 text-xs bg-purple-900/30 hover:bg-purple-900/50 text-purple-300 rounded transition border border-purple-700/30">
          🔑 Admin: admin@atiq.com / Admin123!
        </button>
      </div>
    </div>

  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js"></script>

  <!-- Config -->
  <script src="src/js/config.js"></script>

  <!-- Utils -->
  <script src="src/js/utils.js"></script>

  <!-- Auth Handler -->
  <script>
    // Fill demo credentials
    function fillDemo(email, password) {
      document.getElementById('email').value = email;
      document.getElementById('password').value = password;
      document.getElementById('email').focus();
    }

    // Wait for Firebase to be ready
    function initializeLogin() {
      if (typeof auth === 'undefined' || !firebase.apps.length) {
        // Firebase not ready yet, try again
        setTimeout(initializeLogin, 100);
        return;
      }

      // Login Form Handler
      const loginForm = document.getElementById('loginForm');
      if (loginForm) {
        loginForm.addEventListener('submit', async (e) => {
          e.preventDefault();
          
          const email = document.getElementById('email').value.trim();
          const password = document.getElementById('password').value;
          const errorEl = document.getElementById('error');
          const successEl = document.getElementById('success');

          if (!email || !password) {
            errorEl.textContent = 'Please enter email and password';
            errorEl.classList.remove('hidden');
            return;
          }

          try {
            errorEl.classList.add('hidden');
            successEl.classList.add('hidden');
            
            // Show loading state
            const submitBtn = loginForm.querySelector('button[type="submit"]');
            const originalText = submitBtn.textContent;
            submitBtn.textContent = 'Logging in...';
            submitBtn.disabled = true;

            const userCredential = await auth.signInWithEmailAndPassword(email, password);
            
            successEl.textContent = 'Login successful! Redirecting...';
            successEl.classList.remove('hidden');
            
            // Check if admin
            const idTokenResult = await userCredential.user.getIdTokenResult();
            if (idTokenResult.claims.admin === true) {
              setTimeout(() => {
                window.location.href = 'admin.html';
              }, 1000);
            } else {
              setTimeout(() => {
                window.location.href = 'products.html';
              }, 1000);
            }
          } catch (error) {
            console.error('Login error:', error);
            errorEl.textContent = error.message || 'Login failed. Check email and password.';
            errorEl.classList.remove('hidden');
            
            // Reset button
            const submitBtn = loginForm.querySelector('button[type="submit"]');
            submitBtn.textContent = originalText;
            submitBtn.disabled = false;
          }
        });
      }

      // Check if already logged in
      auth.onAuthStateChanged((user) => {
        if (user) {
          window.location.href = 'products.html';
        }
      });
    }

    // Initialize when page loads
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initializeLogin);
    } else {
      // Page already loaded
      setTimeout(initializeLogin, 500);
    }
  </script>

</body>
</html>
