<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Atiq Super Store - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="src/css/style.css">
</head>

<body class="flex items-center justify-center min-h-screen bg-gradient-to-br from-gray-50 to-gray-100">

  <div class="w-full max-w-md p-8 bg-white border border-gold/30 rounded-2xl shadow-2xl">

    <div class="text-center mb-8">
      <h1 class="text-4xl font-bold mb-2 text-gold">🏪 Atiq Super Store</h1>
      <p class="text-gray-600">Secure Customer Login</p>
    </div>

    <!-- LOGIN FORM -->
    <form id="loginForm" class="space-y-4">

      <div>
        <label class="block text-gray-700 font-bold mb-2">Email Address</label>
        <input
          id="email"
          type="email"
          placeholder="your@email.com"
          class="w-full p-3 bg-gray-50 border border-gray-300 rounded-lg text-gray-900 focus:outline-none focus:border-gold focus:ring-2 focus:ring-gold/20"
          required
        >
      </div>

      <div>
        <label class="block text-gray-700 font-bold mb-2">Password</label>
        <input
          id="password"
          type="password"
          placeholder="••••••••"
          class="w-full p-3 bg-gray-50 border border-gray-300 rounded-lg text-gray-900 focus:outline-none focus:border-gold focus:ring-2 focus:ring-gold/20"
          required
        >
      </div>

      <button
        type="submit"
        class="w-full bg-gradient-to-r from-gold to-yellow-400 text-black p-3 rounded-lg font-bold hover:shadow-lg hover:shadow-gold/30 transition disabled:opacity-50 disabled:cursor-not-allowed"
      >
        Sign In
      </button>

      <button
        type="button"
        onclick="window.location.href='products.html'"
        class="w-full bg-gray-200 hover:bg-gray-300 text-gray-800 p-3 rounded-lg font-bold transition"
      >
        Continue as Guest
      </button>

      <p id="error" class="text-red-600 text-sm mt-2 hidden p-3 bg-red-50 border border-red-200 rounded"></p>
      <p id="success" class="text-green-600 text-sm mt-2 hidden p-3 bg-green-50 border border-green-200 rounded"></p>

    <!-- Demo Users -->
    <div class="mt-6 pt-6 border-t border-gray-200">
      <p class="text-gray-600 text-sm mb-3 text-center">Demo Accounts for Testing:</p>
      
      <div class="space-y-2">
        <button onclick="fillDemo('customer@atiq.com', 'Customer123!')" class="w-full text-left p-3 text-sm bg-blue-50 hover:bg-blue-100 text-blue-700 rounded-lg transition border border-blue-200 hover:border-blue-300">
          👤 <strong>Customer:</strong> customer@atiq.com<br><span class="text-xs text-blue-600">Password: Customer123!</span>
        </button>
        <button onclick="fillDemo('admin@atiq.com', 'Admin123!')" class="w-full text-left p-3 text-sm bg-purple-50 hover:bg-purple-100 text-purple-700 rounded-lg transition border border-purple-200 hover:border-purple-300">
          🔑 <strong>Admin:</strong> admin@atiq.com<br><span class="text-xs text-purple-600">Password: Admin123!</span>
        </button>
      </div>
    </div>

  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js"></script>

  <!-- Config -->
  <script src="src/js/config.js"></script>

  <!-- Utils -->
  <script src="src/js/utils.js"></script>

  <!-- Auth Handler -->
  <script>
    // Fill demo credentials
    function fillDemo(email, password) {
      document.getElementById('email').value = email;
      document.getElementById('password').value = password;
      document.getElementById('email').focus();
    }

    // Wait for Firebase to be ready
    function initializeLogin() {
      if (typeof auth === 'undefined' || !firebase.apps.length) {
        // Firebase not ready yet, try again
        setTimeout(initializeLogin, 100);
        return;
      }

      // Login Form Handler
      const loginForm = document.getElementById('loginForm');
      if (loginForm) {
        loginForm.addEventListener('submit', async (e) => {
          e.preventDefault();
          
          const email = document.getElementById('email').value.trim();
          const password = document.getElementById('password').value;
          const errorEl = document.getElementById('error');
          const successEl = document.getElementById('success');

          if (!email || !password) {
            errorEl.textContent = 'Please enter email and password';
            errorEl.classList.remove('hidden');
            return;
          }

          try {
            errorEl.classList.add('hidden');
            successEl.classList.add('hidden');
            
            // Show loading state
            const submitBtn = loginForm.querySelector('button[type="submit"]');
            const originalText = submitBtn.textContent;
            submitBtn.textContent = 'Logging in...';
            submitBtn.disabled = true;

            const userCredential = await auth.signInWithEmailAndPassword(email, password);
            
            successEl.textContent = 'Login successful! Redirecting...';
            successEl.classList.remove('hidden');
            
            // Check if admin
            const idTokenResult = await userCredential.user.getIdTokenResult();
            if (idTokenResult.claims.admin === true) {
              setTimeout(() => {
                window.location.href = 'admin.html';
              }, 1000);
            } else {
              setTimeout(() => {
                window.location.href = 'products.html';
              }, 1000);
            }
          } catch (error) {
            console.error('Login error:', error);
            errorEl.textContent = error.message || 'Login failed. Check email and password.';
            errorEl.classList.remove('hidden');
            
            // Reset button
            const submitBtn = loginForm.querySelector('button[type="submit"]');
            submitBtn.textContent = originalText;
            submitBtn.disabled = false;
          }
        });
      }

      // Check if already logged in
      auth.onAuthStateChanged((user) => {
        if (user) {
          window.location.href = 'products.html';
        }
      });
    }

    // Initialize when page loads
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initializeLogin);
    } else {
      // Page already loaded
      setTimeout(initializeLogin, 500);
    }
  </script>

</body>
</html>
