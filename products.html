<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - Atiq Super Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="src/css/style.css">
</head>
<body class="bg-white text-gray-900">
    <!-- Navigation -->
    <nav class="fixed w-full top-0 z-50 bg-white border-b border-gray-200 shadow">
        <div class="max-w-6xl mx-auto px-4">
            <div class="flex justify-between items-center h-16">
                <a href="index.html" class="text-xl font-bold text-gold">🏪 Atiq Super Store</a>
                <div class="hidden md:flex gap-6">
                    <a href="products.html" class="text-gold font-bold">Products</a>
                </div>
                <div class="flex items-center gap-4">
                    <a href="cart.html" class="relative text-2xl hover:opacity-70">
                        🛒
                        <span id="cartCount" class="absolute -top-2 -right-2 bg-gold text-black text-xs rounded-full w-5 h-5 flex items-center justify-center font-bold">0</span>
                    </a>
                    <a href="admin.html" id="adminBtn" class="hidden px-3 py-1 bg-gold text-black text-sm font-bold rounded hover:bg-yellow-400">Admin</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="pt-20 pb-12 max-w-6xl mx-auto px-4">
        <h1 class="text-4xl font-bold mb-8 text-gold">Products</h1>

        <!-- Search & Filters -->
        <div class="mb-8 flex flex-col md:flex-row gap-4">
            <div class="flex-1 relative">
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="Search products..." 
                    class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:border-gold"
                    autocomplete="off"
                >
                <div id="searchSuggestions" class="absolute top-full left-0 right-0 bg-white border border-gray-300 rounded-b shadow-lg z-10 hidden max-h-60 overflow-y-auto">
                    <!-- Suggestions will be populated here -->
                </div>
            </div>
            <div class="flex gap-2">
                <input type="number" id="minPrice" placeholder="Min $" class="w-24 px-2 py-2 border border-gray-300 rounded text-sm">
                <input type="number" id="maxPrice" placeholder="Max $" class="w-24 px-2 py-2 border border-gray-300 rounded text-sm">
                <button id="filterBtn" class="px-4 py-2 bg-gold text-black font-bold rounded hover:bg-yellow-400">Filter</button>
            </div>
            <select id="sortSelect" class="px-3 py-2 border border-gray-300 rounded">
                <option value="">Sort</option>
                <option value="price-low">Price: Low to High</option>
                <option value="price-high">Price: High to Low</option>
                <option value="name">Name: A to Z</option>
            </select>
        </div>

        <!-- Products Grid -->
        <div id="productsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <p class="col-span-full text-center text-gray-400 py-12">Loading products...</p>
        </div>

        <!-- No Results -->
        <div id="noResults" class="hidden text-center py-20">
            <p class="text-gray-400 mb-4">No products found</p>
            <button onclick="location.reload()" class="px-4 py-2 bg-gold text-black font-bold rounded hover:bg-yellow-400">Reset</button>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js"></script>

    <script src="src/js/config.js"></script>
    <script src="src/js/utils.js"></script>
    <script src="src/js/products.js"></script>
</body>
</html>
